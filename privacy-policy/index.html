<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy</title>
<style>
:root {
  --bg: #f9f9f9;
  --card: #fff;
  --text: #222;
  --muted: #555;
  --accent: #111;
  --border: #e0e0e0;
}

/* ===== GLOBAL ===== */
body {
  font-family: "Inter", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  line-height: 1.8;
  scroll-behavior: smooth;
}

/* ===== HEADER ===== */
header {
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
  animation: fadeDown 0.6s ease;
}

.logo {
  font-family: "Old English Text MT", "Georgia", serif;
  font-size: 1.6rem;
  color: var(--accent);
  text-decoration: none;
}

.lang-btn {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.4rem 0.9rem;
  cursor: pointer;
  font-size: 0.9rem;
  color: var(--accent);
  transition: all 0.3s ease;
}
.lang-btn:hover {
  background: #111;
  color: #fff;
}

/* ===== MAIN ===== */
main {
  max-width: 850px;
  margin: 5rem auto;
  padding: 0 1.5rem;
  animation: fadeInUp 1s ease;
}

h1 {
  text-align: center;
  font-size: 2rem;
  color: var(--accent);
  margin-bottom: 1.5rem;
}

.policy-card {
  background: var(--card);
  border-radius: 1.2rem;
  box-shadow: 0 8px 25px rgba(0,0,0,0.05);
  padding: 2.5rem;
  border: 1px solid var(--border);
}

.policy-card h2 {
  color: var(--accent);
  font-size: 1.2rem;
  margin-top: 1.5rem;
}

.policy-card p, li {
  color: var(--muted);
  font-size: 1rem;
}

.policy-card ul {
  margin-left: 1.5rem;
}

/* ===== FOOTER ===== */
footer {
  background: #fff;
  border-top: 1px solid var(--border);
  padding: 3rem 2rem 1rem;
  text-align: center;
  color: var(--muted);
  animation: fadeIn 1.5s ease;
}

.footer-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 1.5rem;
  margin-bottom: 1.2rem;
}

.footer-links a {
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s ease;
}

.footer-links a:hover {
  color: var(--accent);
}

footer p {
  font-size: 0.9rem;
  color: var(--muted);
}

/* ===== ANIMATIONS ===== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  main { margin: 4rem 0; }
  .policy-card { padding: 1.6rem; }
  h1 { font-size: 1.7rem; }
  .lang-btn { font-size: 0.8rem; }
}
</style>
</head>
<body>

<header>
  <a href="#" class="logo">Unicorner</a>
  <button class="lang-btn" id="langBtn">???? O‘zbekcha</button>
</header>

<main>
  <h1 id="policyTitle">Privacy Policy</h1>
  <div class="policy-card" id="policyContent"></div>
</main>

<footer>
  <div class="footer-links">
    <a href="#">Home</a>
    <a href="#">Blogs</a>
    <a href="#">About</a>
    <a href="#">Authors</a>
    <a href="#">Contact</a>
  </div>
  <p>?? Tashkent, Uzbekistan | ?? contact@example.com | ?? +998 90 000 0000</p>
  <p>© <span id="year"></span> All rights reserved.</p>
</footer>

<script>

<h2>10. Contact</h2>
<p>If you have questions about this Privacy Policy or how we handle your information, please contact us at: <a href="mailto:contact@example.com">contact@example.com</a></p>
`;

<h2>10. Aloqa</h2>
<p>Agar ushbu siyosat bo‘yicha savollaringiz bo‘lsa, biz bilan quyidagi manzil orqali bog‘laning: <a href="mailto:contact@example.com">contact@example.com</a></p>

let isUz = false;
content.innerHTML = en;

langBtn.addEventListener("click", () => {
  if (isUz) {
    content.innerHTML = en;
    title.textContent = "Privacy Policy";
    langBtn.textContent = "???? O‘zbekcha";
    isUz = false;
  } else {
    content.innerHTML = uz;

</body>
</html>
