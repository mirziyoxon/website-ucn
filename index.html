<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Mobile Redirect -->
  <script>
    if (/Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent)) {
      window.location.href = "https://mob.unicorner.uz";
    }
  </script>
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#808080">

<meta name="description" content="Unicorner is a hub for innovation, startups, and collaboration in Uzbekistan.">
  <meta name="keywords" content="unicorn, unicorner, startup, innovation, uzbekistan, hub, times, news">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unicorner – Startup & Innovation Time</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="photo_2025-03-14_04-25-25.png" />
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">The Unicorner Times</a>
    </div>
    <div class="nav-right" id="nav-links">
      <a href="/about">About</a>
      <a href="https://book.unicorner.uz" target="_blank">Books</a>
      <a href="https://research.unicorner.uz" target="_blank">Research</a>
      <a href="https://article.unicorner.uz" target="_blank">Articles</a>
      <a href="https://publish.unicorner.uz">Publish</a>
      <a href="#">EN</a>
      <a href="https://local.unicorner.uz">UZ</a>
    </div>
    <div class="menu-btn" id="menu-btn">&#9776;</div>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <h1 class="hero-title">Welcome to The&ndash;UCN&ndash;Times</h1>
    <p class="hero-subtitle">Sharing ideas, stories, and thoughts &ndash; one post at a time.</p>
    <form class="subscribe-form">
      <input type="email" placeholder="Enter your email" required />
      <button type="submit">Proceed</button>
    </form>
  </header>

  <!-- Blog Section -->
  <main class="blog-container" id="blog-container">
    <!-- Posts will be injected by JS -->
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 All Rights Reserved </p>
  </footer>

  <!-- Scripts -->
  <script src="script.js"></script>
  <script>
    // Hamburger toggle
    const menuBtn = document.getElementById("menu-btn");
    const navLinks = document.getElementById("nav-links");

    menuBtn.onclick = () => {
      navLinks.classList.toggle("show");
    };

    
    if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('Service Worker registered', reg))
      .catch(err => console.log('Service Worker registration failed', err));
  });
}
  </script>
</body>
</html>
