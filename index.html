<!DOCTYPE html>
<html lang="en">
<head>
   <script>
    if (/Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent)) {
      window.location.href = "https://mob.unicorner.uz";
    }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Unicorner Times</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="photo_2025-03-14_04-25-25.png" />
<style>
   #promoModal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.9);
  display: none; /* Dastlab yashirin */
  justify-content: center;
  align-items: center;
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.3s ease;
}

#promoModal.show {
  display: flex;
  opacity: 1;
}

#promoModal img {
  max-width: 80%;
  max-height: 80%;
  border-radius: 10px;
}

#promoModal .close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  font-weight: bold;
  color: white;
  cursor: pointer;
  z-index: 10000;
}

#promoModal .close:hover {
  color: red;
}
   </style>
</head>
<body>
 
   <!-- Desktop Fullscreen Promo Modal -->
<div id="promoModal">
  <span class="close">&times;</span>
  <img src="pics/reklama3.jpg" alt="Promo Banner">
</div>

   
<div class="overlay" id="popupOverlay">
  <div class="popup">
    <h2>Notice</h2>
    <p>We no longer encourage you to sign up/sign in. As a loyal open-source, we contribute community workshop.</p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>


  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-left">
  <a href="index.html" class="logo">The Unicorner Times</a>
</div>
    <div class="nav-right" id="nav-links">
<a href="/about">About</a>
<a href="https://book.unicorner.uz" target="_blank">Books</a>
<a href="https://research.unicorner.uz" target="_blank">Research</a>
<a href="https://article.unicorner.uz" target="_blank">Articles</a>
<a href="https://publish.unicorner.uz">Publish</a>
      
<a href="#">EN</a>
  <a href="https://local.unicorner.uz">UZ</a>
    </div>
<div class="menu-btn" id="menu-btn">
      &#9776; <!-- Hamburger icon -->
</div>
  </nav>

  <!-- Header / Hero -->
  <header class="hero">
    <h1 class="hero-title">Welcome to  The&ndash;UCN&ndash;Times</h1>
    <p class="hero-subtitle">Sharing ideas, stories, and thoughts &ndash; one post at a time.</p>
    <form class="subscribe-form">
      <input type="email" placeholder="Enter your email" required />
      <button type="submit">Proceed</button>
    </form>
  </header>
  <!-- Blog Section -->
  <main class="blog-container" id="blog-container">
    <!-- Posts will be injected by JS -->
  </main>
    <footer class="footer">
    <p>&copy; 2025 All Rights Reserved </p>
  </footer>
  
  <script src="script.js"></script>
  <script>
     setTimeout(() => {
  document.getElementById("splash").style.display = "none";
  document.getElementById("content").style.display = "flex";
}, 2000); //  2 seconds
    importScripts("https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.sw.js");

  // Show popup when page loads
  window.addEventListener('load', function() {
    // Hide splash after page loads
    document.getElementById("splash").style.display = "none";

    // Show popup
    document.getElementById("popupOverlay").style.display = "flex";
  });

  function closePopup() {
    document.getElementById("popupOverlay").style.display = "none";
  }
    const menuBtn = document.getElementById("menu-btn");
  const navLinks = document.getElementById("nav-links");

  menuBtn.onclick = () => {
    navLinks.classList.toggle("show");
    console.log("Menu toggled"); // Debugging
  };


     
// JS ni body oxirida, DOM elementlar yuklangandan keyin ishlatamiz
document.addEventListener("DOMContentLoaded", function() {
  const modal = document.getElementById("promoModal");
  const closeBtn = modal.querySelector(".close");

  // X tugmasi bosilganda modalni yopish
  closeBtn.addEventListener("click", () => {
    modal.classList.remove("show");
    setTimeout(() => modal.style.display = "none", 300); // fade out
    localStorage.setItem("bannerShownTime", Date.now());
  });

  // 1 soatdan keyin yana ko‘rsatish
  const lastShown = localStorage.getItem("bannerShownTime");
  const now = Date.now();
  const oneHour = 60 * 60 * 1000;

  if (!lastShown || now - lastShown > oneHour) {
    modal.style.display = "flex";
    setTimeout(() => modal.classList.add("show"), 10); // fade in
  }
});
</script>
</body>
</html>
